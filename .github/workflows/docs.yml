name: Docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**" # the API reference is generated from the source
      - ".github/workflows/docs.yml"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # setup-uv publishes moving major tags only through v7; newer releases
        # are exact tags only, so v10 must be pinned precisely.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # --strict turns broken cross-references into build failures, so a bad
      # [`Symbol`][masoora.Symbol] link fails here rather than shipping dead.
      - name: Build
        run: uv run --group docs mkdocs build --strict

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
