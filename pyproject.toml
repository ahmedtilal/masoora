[project]
name = "masoora"
version = "0.1.4"
description = "Fluent builder for testable ETL pipelines"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ahmed Osman", email = "79141373+ahmedtilal@users.noreply.github.com" }
]
requires-python = ">=3.10"
keywords = ["etl", "pipeline", "dag", "data-engineering", "builder", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.13.4",
]

[project.urls]
Homepage = "https://ahmedtilal.github.io/masoora/"
Documentation = "https://ahmedtilal.github.io/masoora/"
Repository = "https://github.com/ahmedtilal/masoora"
Issues = "https://github.com/ahmedtilal/masoora/issues"
Changelog = "https://github.com/ahmedtilal/masoora/blob/master/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.8.8,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["CHANGELOG.md"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

[project.optional-dependencies]
pytest = ["pytest>=9.0"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
