[project]
name = "masoora"
version = "0.1.0"
description = "Fluent builder for testable ETL pipelines"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Ahmed Osman", email = "79141373+ahmedtilal@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13.4",
]

[build-system]
requires = ["uv_build>=0.8.8,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[project.optional-dependencies]
pytest = ["pytest>=9.0"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
